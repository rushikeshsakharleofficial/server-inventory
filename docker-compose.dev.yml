# Development only. Explicitly use both files:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# The proxy still serves http://localhost:3001; Vite is also available on :5173.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    environment:
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "127.0.0.1:5173:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
